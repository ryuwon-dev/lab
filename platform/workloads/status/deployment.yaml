apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  namespace: status
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: status
    app.kubernetes.io/instance: status
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: status
      app.kubernetes.io/instance: status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status
        app.kubernetes.io/instance: status
    spec:
      serviceAccountName: status-runtime
      automountServiceAccountToken: false
      nodeSelector:
        node-role.ryuwon.dev/app: "true"
      tolerations:
        - key: workload.ryuwon.dev/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: status-static
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: status-static
          configMap:
            name: status-static
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: status
  namespace: status
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status
      app.kubernetes.io/instance: status
