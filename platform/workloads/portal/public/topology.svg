<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">류원랩 구성도</title>
  <desc id="desc">공개 DNS가 Account B 서비스 노드로 들어오고, Account A는 코어 제어면을 담당한다.</desc>
  <rect width="1120" height="260" fill="#fffaf0"/>
  <path d="M112 132h240M408 132h304M768 132h240" stroke="#6f6860" stroke-width="3" stroke-linecap="round"/>
  <circle cx="112" cy="132" r="42" fill="#f5efe1" stroke="#171412" stroke-width="2"/>
  <text x="112" y="126" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="700" fill="#171412">공개</text>
  <text x="112" y="146" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#504a43">DNS</text>
  <rect x="352" y="70" width="112" height="124" rx="6" fill="#fffaf0" stroke="#171412"/>
  <text x="408" y="106" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#171412">계정 B</text>
  <text x="408" y="130" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#504a43">서비스</text>
  <text x="408" y="150" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#504a43">노드</text>
  <rect x="712" y="70" width="112" height="124" rx="6" fill="#fffaf0" stroke="#171412"/>
  <text x="768" y="106" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#171412">계정 A</text>
  <text x="768" y="130" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#504a43">코어</text>
  <text x="768" y="150" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#504a43">제어면</text>
  <rect x="984" y="92" width="64" height="80" rx="6" fill="#f0e6d3" stroke="#171412"/>
  <text x="1016" y="126" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="700" fill="#171412">백업</text>
  <text x="1016" y="148" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#504a43">DR</text>
  <text x="260" y="114" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#504a43">HTTPS</text>
  <text x="588" y="114" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#504a43">사설 피어링</text>
  <text x="888" y="114" text-anchor="middle" font-family="GMarketSans, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#504a43">복구 경로</text>
</svg>
