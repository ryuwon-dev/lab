apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: portal-static
    files:
      - public/index.html
      - public/styles.css
      - public/app.js
      - public/services.json
      - public/health.json
      - public/topology.svg
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/instance: portal
